<svg viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="var(--font-sans, system-ui, sans-serif)">
  <title>How SecureChannel fits together</title>
  <desc>Two peers connect over a TCP socket. In Phase A they run an X25519 key exchange, authenticate with HMAC over the transcript using the pre-shared key, and derive session keys with HKDF. In Phase B every message is encrypted with ChaCha20-Poly1305, the header is authenticated as associated data, and a counter blocks replays.</desc>
  <defs>
    <marker id="arrowo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-text-secondary, #5F5E5A)"/>
    </marker>
  </defs>
  <style>
    .lbl  { fill: var(--color-text-primary, #2C2C2A); font-size: 14px; font-weight: 600; }
    .sub  { fill: var(--color-text-secondary, #5F5E5A); font-size: 12px; font-family: var(--font-mono, ui-monospace, monospace); }
    .sm   { fill: var(--color-text-secondary, #5F5E5A); font-size: 10.5px; }
    .flow { stroke: var(--color-text-secondary, #5F5E5A); stroke-width: 1.6; fill: none; }
    .neu  { fill: var(--color-background-secondary, #F1EFE8); stroke: var(--color-border-secondary, #D3D1C7); stroke-width: 1.2; }
    .blu  { fill: #E6F1FB; stroke: #378ADD; stroke-width: 1.2; }
    .blu2 { fill: #B5D4F4; stroke: #378ADD; stroke-width: 1.2; }
    .box  { fill: none; stroke: var(--color-border-secondary, #D3D1C7); stroke-width: 1.4; stroke-dasharray: 6 5; }
  </style>

  <text x="380" y="34" text-anchor="middle" class="lbl" font-size="21">How SecureChannel fits together</text>

  <rect x="150" y="56" width="170" height="44" rx="9" class="neu"/>
  <text x="235" y="83" text-anchor="middle" class="lbl">Client</text>
  <rect x="440" y="56" width="170" height="44" rx="9" class="neu"/>
  <text x="525" y="83" text-anchor="middle" class="lbl">Server</text>
  <text x="380" y="74" text-anchor="middle" class="sm">TCP socket</text>
  <line x1="320" y1="80" x2="440" y2="80" class="flow"/>

  <line x1="380" y1="100" x2="380" y2="136" class="flow" marker-end="url(#arrowo)"/>

  <rect x="60" y="140" width="640" height="214" rx="12" class="box"/>
  <text x="84" y="165" class="lbl" font-size="13">Phase A · Handshake (set up keys, prove identity)</text>

  <rect x="96" y="180" width="420" height="42" rx="9" class="blu"/>
  <text x="306" y="206" text-anchor="middle" class="lbl" font-size="13">1. X25519 key exchange  →  shared secret</text>
  <rect x="544" y="180" width="140" height="42" rx="8" class="neu"/>
  <text x="614" y="206" text-anchor="middle" class="sub" font-size="11">x25519.py</text>

  <rect x="96" y="236" width="420" height="42" rx="9" class="blu"/>
  <text x="306" y="262" text-anchor="middle" class="lbl" font-size="13">2. HMAC(PSK, transcript)  →  authenticate</text>
  <rect x="544" y="236" width="140" height="42" rx="8" class="neu"/>
  <text x="614" y="258" text-anchor="middle" class="sub" font-size="11">hmac.py</text>
  <text x="614" y="272" text-anchor="middle" class="sub" font-size="11">sha256.py</text>

  <rect x="96" y="292" width="420" height="42" rx="9" class="blu"/>
  <text x="306" y="318" text-anchor="middle" class="lbl" font-size="13">3. HKDF(PSK, shared)  →  keys + nonces</text>
  <rect x="544" y="292" width="140" height="42" rx="8" class="neu"/>
  <text x="614" y="318" text-anchor="middle" class="sub" font-size="11">hkdf.py</text>

  <line x1="306" y1="222" x2="306" y2="236" class="flow" marker-end="url(#arrowo)"/>
  <line x1="306" y1="278" x2="306" y2="292" class="flow" marker-end="url(#arrowo)"/>
  <line x1="516" y1="201" x2="544" y2="201" class="flow"/>
  <line x1="516" y1="257" x2="544" y2="257" class="flow"/>
  <line x1="516" y1="313" x2="544" y2="313" class="flow"/>

  <line x1="380" y1="354" x2="380" y2="392" class="flow" marker-end="url(#arrowo)"/>

  <rect x="60" y="396" width="640" height="158" rx="12" class="box"/>
  <text x="84" y="421" class="lbl" font-size="13">Phase B · Secure messaging</text>

  <rect x="96" y="436" width="420" height="98" rx="10" class="blu2"/>
  <text x="306" y="464" text-anchor="middle" class="lbl" font-size="13">ChaCha20-Poly1305 on every message</text>
  <text x="306" y="488" text-anchor="middle" class="sub" font-size="11">header (version, sender, counter) = AAD</text>
  <text x="306" y="508" text-anchor="middle" class="sub" font-size="11">counter blocks replays</text>

  <rect x="544" y="464" width="140" height="42" rx="8" class="neu"/>
  <text x="614" y="490" text-anchor="middle" class="sub" font-size="11">aead.py</text>
  <line x1="516" y1="485" x2="544" y2="485" class="flow"/>
</svg>
