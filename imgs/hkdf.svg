<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="var(--font-sans, system-ui, sans-serif)">
  <title>HKDF</title>
  <desc>HKDF has two steps: extract runs one HMAC over the salt and shared secret to make a single PRK, then expand chains HMAC blocks from the PRK and splits the output into the directional session keys and nonce material.</desc>
  <defs>
    <marker id="arrowk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-text-secondary, #5F5E5A)"/>
    </marker>
  </defs>
  <style>
    .lbl  { fill: var(--color-text-primary, #2C2C2A); font-size: 14px; font-weight: 600; }
    .sub  { fill: var(--color-text-secondary, #5F5E5A); font-size: 12px; font-family: var(--font-mono, ui-monospace, monospace); }
    .sm   { fill: var(--color-text-secondary, #5F5E5A); font-size: 10.5px; }
    .flow { stroke: var(--color-text-secondary, #5F5E5A); stroke-width: 1.6; fill: none; }
    .neu  { fill: var(--color-background-secondary, #F1EFE8); stroke: var(--color-border-secondary, #D3D1C7); stroke-width: 1.2; }
    .blu  { fill: #E6F1FB; stroke: #378ADD; stroke-width: 1.2; }
    .blu2 { fill: #B5D4F4; stroke: #378ADD; stroke-width: 1.2; }
    .box  { fill: none; stroke: var(--color-border-secondary, #D3D1C7); stroke-width: 1.4; stroke-dasharray: 6 5; }
  </style>

  <text x="360" y="30" text-anchor="middle" class="lbl" font-size="20">HKDF — turn one secret into many keys</text>

  <rect x="50" y="46" width="620" height="150" rx="12" class="box"/>
  <text x="72" y="70" class="lbl" font-size="13">Step 1 · Extract</text>
  <rect x="90" y="92" width="150" height="34" rx="8" class="blu"/>
  <text x="165" y="114" text-anchor="middle" class="lbl" font-size="12">salt = PSK</text>
  <rect x="90" y="136" width="220" height="34" rx="8" class="blu"/>
  <text x="200" y="158" text-anchor="middle" class="sub" font-size="11">shared secret (X25519)</text>
  <line x1="240" y1="109" x2="350" y2="120" class="flow" marker-end="url(#arrowk)"/>
  <line x1="310" y1="153" x2="350" y2="142" class="flow" marker-end="url(#arrowk)"/>
  <rect x="350" y="104" width="110" height="54" rx="9" class="neu"/>
  <text x="405" y="136" text-anchor="middle" class="lbl">HMAC</text>
  <line x1="460" y1="131" x2="500" y2="131" class="flow" marker-end="url(#arrowk)"/>
  <rect x="500" y="104" width="140" height="54" rx="9" class="blu2"/>
  <text x="570" y="128" text-anchor="middle" class="lbl">PRK</text>
  <text x="570" y="146" text-anchor="middle" class="sub" font-size="11">32 bytes</text>

  <rect x="50" y="212" width="620" height="322" rx="12" class="box"/>
  <text x="72" y="236" class="lbl" font-size="13">Step 2 · Expand</text>
  <line x1="570" y1="158" x2="570" y2="212" class="flow" marker-end="url(#arrowk)"/>
  <line x1="120" y1="262" x2="624" y2="262" stroke="var(--color-border-secondary, #D3D1C7)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="78" y="266" class="sm">PRK</text>

  <rect x="96" y="286" width="140" height="46" rx="9" class="blu"/>
  <text x="166" y="309" text-anchor="middle" class="lbl" font-size="13">HMAC</text>
  <text x="166" y="325" text-anchor="middle" class="sub">→ T1</text>
  <rect x="290" y="286" width="140" height="46" rx="9" class="blu"/>
  <text x="360" y="309" text-anchor="middle" class="lbl" font-size="13">HMAC</text>
  <text x="360" y="325" text-anchor="middle" class="sub">→ T2</text>
  <rect x="484" y="286" width="140" height="46" rx="9" class="blu"/>
  <text x="554" y="309" text-anchor="middle" class="lbl" font-size="13">HMAC</text>
  <text x="554" y="325" text-anchor="middle" class="sub">→ T3</text>

  <line x1="166" y1="262" x2="166" y2="286" class="flow" marker-end="url(#arrowk)"/>
  <line x1="360" y1="262" x2="360" y2="286" class="flow" marker-end="url(#arrowk)"/>
  <line x1="554" y1="262" x2="554" y2="286" class="flow" marker-end="url(#arrowk)"/>
  <line x1="236" y1="309" x2="290" y2="309" class="flow" marker-end="url(#arrowk)"/>
  <line x1="430" y1="309" x2="484" y2="309" class="flow" marker-end="url(#arrowk)"/>

  <text x="360" y="356" text-anchor="middle" class="sub" font-size="11">each block = HMAC(PRK, previous ‖ info ‖ counter)</text>

  <rect x="160" y="372" width="400" height="40" rx="9" class="neu"/>
  <text x="360" y="397" text-anchor="middle" class="lbl" font-size="13">OKM = T1 ‖ T2 ‖ T3 ‖ …</text>
  <line x1="166" y1="332" x2="240" y2="372" class="flow" marker-end="url(#arrowk)"/>
  <line x1="360" y1="332" x2="360" y2="372" class="flow" marker-end="url(#arrowk)"/>
  <line x1="554" y1="332" x2="480" y2="372" class="flow" marker-end="url(#arrowk)"/>

  <rect x="92" y="448" width="170" height="42" rx="8" class="blu2"/>
  <text x="177" y="474" text-anchor="middle" class="lbl" font-size="12">client → server key</text>
  <rect x="278" y="448" width="170" height="42" rx="8" class="blu2"/>
  <text x="363" y="474" text-anchor="middle" class="lbl" font-size="12">server → client key</text>
  <rect x="464" y="448" width="170" height="42" rx="8" class="blu2"/>
  <text x="549" y="474" text-anchor="middle" class="lbl" font-size="12">starting nonces / IVs</text>
  <line x1="360" y1="412" x2="177" y2="448" class="flow" marker-end="url(#arrowk)"/>
  <line x1="360" y1="412" x2="363" y2="448" class="flow" marker-end="url(#arrowk)"/>
  <line x1="360" y1="412" x2="549" y2="448" class="flow" marker-end="url(#arrowk)"/>
</svg>
